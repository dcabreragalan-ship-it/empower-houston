<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Empower Houston</title>
<style>
body{margin:0;background:#0b1020;color:white;font-family:Arial,sans-serif}
main{max-width:500px;margin:auto;padding:16px}
img{width:100%;border-radius:22px}
.card{background:#121a2b;padding:22px;border-radius:22px;margin-top:18px}
h1{font-size:30px}
.code{background:white;color:black;font-size:34px;font-weight:bold;text-align:center;padding:16px;border-radius:14px}
a,button{display:block;width:100%;box-sizing:border-box;margin-top:12px;padding:15px;border:0;border-radius:14px;text-align:center;color:white;text-decoration:none;font-size:18px;font-weight:bold}
.copy{background:#263249}
.iphone{background:#673cff}
.android{background:#263249}
p{color:#c5cbd6;line-height:1.5}
</style>
</head>

<body>
<main>

<img src="promo.png" alt="Empower Houston promo">

<div class="card">
<h1>Get $20 in free rides</h1>

<p>Download Empower and use promo code:</p>

<div class="code">4K9F2C</div>

<button class="copy"
onclick="navigator.clipboard.writeText('4K9F2C')">
Copy promo code
</button>

<a class="iphone"
href="https://apps.apple.com/us/app/empower-your-ride-your-way/id1454849875">
Download on iPhone
</a>

<a class="android"
href="https://play.google.com/store/apps/details?id=com.yazam.empower.passenger">
Download on Android
</a>

<p>
Español: Descarga Empower y usa el código
<strong>4K9F2C</strong> al registrarte.
</p>

</div>
</main>
</body>
</html>
